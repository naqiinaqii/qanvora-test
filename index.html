<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanvora — Edit Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121110;
    --bg-elev: #1B1917;
    --bg-field: #17150F;
    --brass: #C9A063;
    --brass-dim: #8B7048;
    --ivory: #EDE7DA;
    --stone: #8C877D;
    --line: #2B2823;
    --good: #7FA679;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    background:var(--bg);
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  .shell{
    max-width:920px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  /* ---- header ---- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:34px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }

  .brand{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:19px;
    color:var(--brass);
  }

  .save-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--stone);
    display:flex;
    align-items:center;
    gap:6px;
  }

  .save-status .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--good);
  }

  /* ---- layout ---- */
  .layout{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:32px;
    align-items:start;
  }

  @media (max-width:760px){
    .layout{ grid-template-columns:1fr; }
    .preview-col{ order:-1; }
  }

  /* ---- form ---- */
  .section{
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px;
    margin-bottom:20px;
  }

  .section-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:20px;
  }

  .avatar-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
  }

  .avatar-upload{
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(155deg,#2A2620,#171512);
    border:1px dashed var(--brass-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--brass);
    font-family:'Fraunces', serif;
    font-size:22px;
    flex-shrink:0;
    cursor:pointer;
  }

  .avatar-hint{
    font-size:12px;
    color:var(--stone);
    line-height:1.5;
  }

  .avatar-hint a{ color:var(--brass); text-decoration:none; }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  @media (max-width:480px){
    .field-row{ grid-template-columns:1fr; }
  }

  .field{ margin-bottom:16px; }

  .field label{
    display:block;
    font-size:12px;
    color:var(--stone);
    margin-bottom:7px;
  }

  .field input{
    width:100%;
    background:var(--bg-field);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 13px;
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .15s ease;
  }

  .field input:focus{ border-color:var(--brass-dim); }
  .field input::placeholder{ color:#5B564D; }

  .field .icon-input{
    display:flex;
    align-items:center;
    background:var(--bg-field);
    border:1px solid var(--line);
    border-radius:9px;
    padding:0 13px;
  }

  .field .icon-input:focus-within{ border-color:var(--brass-dim); }

  .field .icon-input svg{
    width:14px; height:14px;
    color:var(--stone);
    flex-shrink:0;
    margin-right:9px;
  }

  .field .icon-input input{
    border:none;
    padding:11px 0;
    background:transparent;
  }

  .field .icon-input input:focus{ outline:none; }

  .field:last-child{ margin-bottom:0; }

  .actions-bar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:11px 20px;
    border-radius:9px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--stone);
    cursor:pointer;
  }

  .btn.primary{
    background:var(--brass);
    color:#171512;
    border-color:var(--brass);
    font-weight:600;
  }

  /* ---- preview ---- */
  .preview-col{ position:sticky; top:36px; }

  .preview-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--stone);
    margin-bottom:12px;
  }

  .preview-card{
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-radius:18px;
    padding:30px 22px 22px;
    text-align:center;
  }

  .preview-avatar{
    width:56px;
    height:56px;
    border-radius:50%;
    margin:0 auto 14px;
    background:linear-gradient(155deg,#2A2620,#171512);
    border:1px solid var(--brass-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-size:20px;
    color:var(--brass);
  }

  .preview-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    margin-bottom:4px;
  }

  .preview-role{
    font-size:12px;
    color:var(--stone);
    margin-bottom:18px;
  }

  .preview-btn{
    background:var(--brass);
    color:#171512;
    font-size:12px;
    font-weight:600;
    padding:10px;
    border-radius:8px;
    margin-bottom:16px;
  }

  .preview-link-row{
    display:flex;
    justify-content:center;
    gap:8px;
  }

  .preview-link-row span{
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--stone);
    font-size:11px;
  }

  .preview-note{
    font-size:11px;
    color:var(--stone);
    text-align:center;
    margin-top:12px;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="shell">

  <div class="topbar">
    <div class="brand">Kanvora — Edit Profile</div>
    <div class="save-status"><span class="dot"></span>Changes saved</div>
  </div>

  <div class="layout">

    <!-- FORM -->
    <div>

      <div class="section">
        <div class="section-title">Identity</div>
        <div class="avatar-row">
          <div class="avatar-upload">DA</div>
          <div class="avatar-hint">Square photo, min 400×400px.<br><a href="#">Upload new photo</a></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Full name</label>
            <input type="text" value="Dayang Aqilah">
          </div>
          <div class="field">
            <label>Job title</label>
            <input type="text" value="Business Development Manager">
          </div>
        </div>
        <div class="field">
          <label>Company</label>
          <input type="text" value="Serambi Holdings">
        </div>
      </div>

      <div class="section">
        <div class="section-title">Contact</div>
        <div class="field">
          <label>Phone number</label>
          <div class="icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input type="text" value="+673 8XX XXXX">
          </div>
        </div>
        <div class="field">
          <label>WhatsApp number</label>
          <div class="icon-input">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"/></svg>
            <input type="text" value="+673 8XX XXXX">
          </div>
        </div>
        <div class="field">
          <label>Email address</label>
          <div class="icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input type="text" value="dayang@serambiholdings.bn">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Links</div>
        <div class="field">
          <label>LinkedIn</label>
          <input type="text" placeholder="linkedin.com/in/username">
        </div>
        <div class="field">
          <label>Instagram</label>
          <input type="text" placeholder="instagram.com/username">
        </div>
        <div class="field">
          <label>Website</label>
          <input type="text" placeholder="yourcompany.com">
        </div>
      </div>

      <div class="actions-bar">
        <button class="btn">Discard</button>
        <button class="btn primary">Save changes</button>
      </div>

    </div>

    <!-- LIVE PREVIEW -->
    <div class="preview-col">
      <div class="preview-label">Live Preview</div>
      <div class="preview-card">
        <div class="preview-avatar">DA</div>
        <div class="preview-name">Dayang Aqilah</div>
        <div class="preview-role">Business Development Manager</div>
        <div class="preview-btn">Save Contact</div>
        <div class="preview-link-row">
          <span>in</span><span>ig</span><span>w</span>
        </div>
      </div>
      <div class="preview-note">This is what visitors see<br>when they tap your card.</div>
    </div>

  </div>

</div>

</body>
</html>
