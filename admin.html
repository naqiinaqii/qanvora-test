<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanvora — Edit Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#121110; --bg-elev:#1B1917; --bg-field:#17150F;
    --brass:#C9A063; --brass-dim:#8B7048; --ivory:#EDE7DA;
    --stone:#8C877D; --line:#2B2823; --good:#7FA679; --warn:#C97A63;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh; }
  .shell{ max-width:920px; margin:0 auto; padding:36px 20px 80px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; padding-bottom:20px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Fraunces',serif; font-style:italic; font-size:19px; color:var(--brass); }
  .save-status{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--stone); display:flex; align-items:center; gap:6px; }
  .save-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); }
  .save-status.warn .dot{ background:var(--warn); }
  .layout{ display:grid; grid-template-columns:1fr 320px; gap:32px; align-items:start; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } .preview-col{ order:-1; } }
  .section{ background:var(--bg-elev); border:1px solid var(--line); border-radius:16px; padding:26px; margin-bottom:20px; }
  .section-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--brass); margin-bottom:20px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:480px){ .field-row{ grid-template-columns:1fr; } }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--stone); margin-bottom:7px; }
  .field input{ width:100%; background:var(--bg-field); border:1px solid var(--line); border-radius:9px; padding:11px 13px; color:var(--ivory); font-family:'Inter',sans-serif; font-size:14px; outline:none; }
  .field input:focus{ border-color:var(--brass-dim); }
  .field input::placeholder{ color:#5B564D; }
  .field:last-child{ margin-bottom:0; }
  .slug-field input{ font-family:'IBM Plex Mono',monospace; }
  .slug-hint{ font-size:11px; color:var(--stone); margin-top:6px; }
  .actions-bar{ display:flex; justify-content:flex-end; gap:10px; }
  .btn{ font-family:'Inter',sans-serif; font-size:13px; font-weight:500; padding:11px 20px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--stone); cursor:pointer; }
  .btn.primary{ background:var(--brass); color:#171512; border-color:var(--brass); font-weight:600; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .preview-col{ position:sticky; top:36px; }
  .preview-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--stone); margin-bottom:12px; }
  .preview-card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:18px; padding:30px 22px 22px; text-align:center; }
  .preview-avatar{ width:56px; height:56px; border-radius:50%; margin:0 auto 14px; background:linear-gradient(155deg,#2A2620,#171512); border:1px solid var(--brass-dim); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:20px; color:var(--brass); }
  .preview-name{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:20px; margin-bottom:4px; }
  .preview-role{ font-size:12px; color:var(--stone); margin-bottom:18px; }
  .preview-btn{ background:var(--brass); color:#171512; font-size:12px; font-weight:600; padding:10px; border-radius:8px; margin-bottom:6px; }
  .preview-note{ font-size:11px; color:var(--stone); text-align:center; margin-top:12px; line-height:1.5; }
  .preview-link{ font-size:11px; color:var(--brass); word-break:break-all; margin-top:14px; display:block; }

  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:220px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--line); padding:28px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .sidebar-brand{ font-family:'Fraunces',serif; font-style:italic; font-size:19px; color:var(--brass); margin-bottom:32px; padding:0 6px; }
  .sidebar-nav{ display:flex; flex-direction:column; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; color:var(--stone); text-decoration:none; font-size:13px; font-weight:500; margin-bottom:4px; }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; }
  .nav-item:hover{ background:var(--bg-field); color:var(--ivory); }
  .nav-item.active{ background:var(--bg-field); color:var(--brass); }
  .nav-item.disabled{ opacity:.45; cursor:not-allowed; pointer-events:none; }
  .sidebar-footer{ margin-top:auto; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .main{ flex:1; min-width:0; }
  @media (max-width:760px){
    .app{ flex-direction:column; }
    .sidebar{ width:auto; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 16px; }
    .sidebar-brand{ margin-bottom:0; margin-right:16px; }
    .sidebar-nav{ flex-direction:row; gap:6px; flex:1; }
    .nav-item{ margin-bottom:0; }
    .sidebar-footer{ margin-top:0; padding-top:0; border-top:none; flex-direction:row; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar" style="display:none;">
    <div class="sidebar-brand">Kanvora</div>
    <div class="sidebar-nav">
      <a class="nav-item active" href="admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Edit Profile
      </a>
      <a class="nav-item disabled" id="viewProfileLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        View Profile
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="save-status" id="status"><span class="dot"></span><span id="statusText">Not saved yet</span></div>
      <button class="btn" id="logoutBtn" onclick="logout()">Log out</button>
    </div>
  </nav>

  <main class="main">
  <div class="shell">

  <div class="section" id="authGate">
    <div class="section-title">Sign In</div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="authEmail" placeholder="you@company.com">
    </div>
    <div class="actions-bar">
      <button class="btn primary" id="authBtn" onclick="sendMagicLink()">Send magic link</button>
    </div>
    <div class="slug-hint" id="authMsg" style="margin-top:12px;"></div>
  </div>

  <div class="layout" id="editorRoot" style="display:none;">
    <div>

      <div class="section">
        <div class="section-title">Profile Link</div>
        <div class="field slug-field">
          <label>Link ID (this becomes your card's URL)</label>
          <input type="text" id="slug" placeholder="e.g. dayang-aqilah">
          <div class="slug-hint">Letters, numbers, hyphens only. No spaces. Cannot be changed once cards are printed with it.</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Identity</div>
        <div class="field-row">
          <div class="field"><label>Full name</label><input type="text" id="name" placeholder="Dayang Aqilah"></div>
          <div class="field"><label>Job title</label><input type="text" id="title" placeholder="Business Development Manager"></div>
        </div>
        <div class="field"><label>Company</label><input type="text" id="company" placeholder="Serambi Holdings"></div>
      </div>

      <div class="section">
        <div class="section-title">Contact</div>
        <div class="field"><label>Phone number</label><input type="text" id="phone" placeholder="+6738XXXXXX"></div>
        <div class="field"><label>WhatsApp number</label><input type="text" id="whatsapp" placeholder="+6738XXXXXX"></div>
        <div class="field"><label>Email address</label><input type="text" id="email" placeholder="you@company.com"></div>
      </div>

      <div class="section">
        <div class="section-title">Links</div>
        <div class="field"><label>LinkedIn</label><input type="text" id="linkedin" placeholder="linkedin.com/in/username"></div>
        <div class="field"><label>Instagram</label><input type="text" id="instagram" placeholder="instagram.com/username"></div>
        <div class="field"><label>Website</label><input type="text" id="website" placeholder="yourcompany.com"></div>
      </div>

      <div class="actions-bar">
        <button class="btn" onclick="loadProfile()">Reload</button>
        <button class="btn primary" id="saveBtn" onclick="saveProfile()">Save changes</button>
      </div>

    </div>

    <div class="preview-col">
      <div class="preview-label">Live Preview</div>
      <div class="preview-card">
        <div class="preview-avatar" id="pv-initials">--</div>
        <div class="preview-name" id="pv-name">Your name</div>
        <div class="preview-role" id="pv-role">Your title</div>
        <div class="preview-btn">Save Contact</div>
      </div>
      <div class="preview-note">This is what visitors see when they tap your card.</div>
      <a class="preview-link" id="pv-link" href="#" target="_blank"></a>
    </div>
  </div>

  </div>
  </main>
</div>

<script>
  // ====== PASTE YOUR SUPABASE VALUES HERE ======
  const SUPABASE_URL = "https://bibusweogtxqgianrvyb.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_QmcRmNwgumBxUf3HTSmRiA_HgbgryV1";
  // ==============================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const fields = ["name","title","company","phone","whatsapp","email","linkedin","instagram","website"];

  let currentUser = null;

  async function initAuth(){
    const { data: { session } } = await sb.auth.getSession();
    handleSession(session);
    sb.auth.onAuthStateChange((_event, session) => handleSession(session));
  }

  function handleSession(session){
    currentUser = session?.user || null;
    document.getElementById("authGate").style.display = currentUser ? "none" : "block";
    document.getElementById("editorRoot").style.display = currentUser ? "grid" : "none";
    document.getElementById("sidebar").style.display = currentUser ? "flex" : "none";
    if(currentUser){ loadProfile(); }
  }

  async function sendMagicLink(){
    const email = document.getElementById("authEmail").value.trim();
    const msg = document.getElementById("authMsg");
    if(!email){ msg.textContent = "Enter your email first"; return; }

    const btn = document.getElementById("authBtn");
    btn.disabled = true;
    msg.textContent = "Sending...";

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });

    btn.disabled = false;
    if(error){
      msg.textContent = "Failed to send link — check console";
      console.error(error);
    } else {
      msg.textContent = "Check your email for a sign-in link.";
    }
  }

  async function logout(){
    await sb.auth.signOut();
  }

  function setStatus(text, warn){
    document.getElementById("statusText").textContent = text;
    document.getElementById("status").className = "save-status" + (warn ? " warn" : "");
  }

  function updatePreview(){
    const name = document.getElementById("name").value || "Your name";
    const title = document.getElementById("title").value || "Your title";
    document.getElementById("pv-name").textContent = name;
    document.getElementById("pv-role").textContent = title;
    const initials = name.split(" ").filter(Boolean).slice(0,2).map(w => w[0]?.toUpperCase() || "").join("") || "--";
    document.getElementById("pv-initials").textContent = initials;

    const slug = document.getElementById("slug").value.trim();
    const link = document.getElementById("pv-link");
    const navLink = document.getElementById("viewProfileLink");
    if(slug){
      const url = window.location.origin + "/profile.html?id=" + encodeURIComponent(slug);
      link.href = url;
      link.textContent = url;
      navLink.href = url;
      navLink.classList.remove("disabled");
    } else {
      link.href = "#";
      link.textContent = "";
      navLink.href = "#";
      navLink.classList.add("disabled");
    }
  }

  async function loadProfile(){
    if(!currentUser) return;

    setStatus("Loading...");
    const { data, error } = await sb.from("profiles").select("*").eq("owner_id", currentUser.id).maybeSingle();

    if(error){
      setStatus("Load failed — check console", true);
      console.error(error);
      return;
    }

    if(data){
      document.getElementById("slug").value = data.id;
      fields.forEach(f => document.getElementById(f).value = data[f] || "");
      setStatus("Loaded existing profile");
    } else {
      document.getElementById("slug").value = "";
      fields.forEach(f => document.getElementById(f).value = "");
      setStatus("New profile — choose a Link ID and save", true);
    }
    updatePreview();
  }

  async function saveProfile(){
    if(!currentUser){ setStatus("Sign in first", true); return; }

    const slug = document.getElementById("slug").value.trim();
    if(!slug){ setStatus("Link ID is required", true); return; }
    if(!/^[a-z0-9-]+$/i.test(slug)){ setStatus("Link ID: letters, numbers, hyphens only", true); return; }

    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    setStatus("Saving...");

    const row = { id: slug, owner_id: currentUser.id };
    fields.forEach(f => row[f] = document.getElementById(f).value.trim());

    const { error } = await sb.from("profiles").upsert(row);

    btn.disabled = false;
    if(error){
      setStatus("Save failed — Link ID may be taken, or check console", true);
      console.error(error);
    } else {
      setStatus("Changes saved");
    }
  }

  fields.concat(["slug"]).forEach(f => {
    document.getElementById(f).addEventListener("input", updatePreview);
  });

  window.addEventListener("DOMContentLoaded", initAuth);
</script>

</body>
</html>
