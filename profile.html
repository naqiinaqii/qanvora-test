<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qanvora — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#121110; --bg-elev:#1B1917; --brass:#C9A063; --brass-dim:#8B7048;
    --ivory:#EDE7DA; --stone:#8C877D; --line:#2B2823;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ background:radial-gradient(ellipse 90% 65% at 50% 35%, color-mix(in srgb, var(--brass) 16%, var(--bg)) 0%, var(--bg) 70%); min-height:100vh; }
  body{ color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .card{ width:100%; max-width:380px; background:var(--bg-elev); border:1px solid var(--line); border-radius:20px; padding:40px 28px 28px; position:relative; overflow:hidden; }
  .tap-zone{ position:relative; width:112px; height:112px; margin:0 auto 22px; display:flex; align-items:center; justify-content:center; }
  .ripple{ position:absolute; border-radius:50%; border:1px solid var(--brass-dim); opacity:0; animation:ripple 2.8s ease-out infinite; }
  .ripple.r2{ animation-delay:.7s; } .ripple.r3{ animation-delay:1.4s; }
  @keyframes ripple{ 0%{width:72px;height:72px;opacity:.55;} 100%{width:150px;height:150px;opacity:0;} }
  @media (prefers-reduced-motion: reduce){ .ripple{ animation:none; opacity:0; } }
  .avatar{ width:72px; height:72px; border-radius:50%; background:linear-gradient(155deg,#2A2620,#171512); border:1px solid var(--brass-dim); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:26px; color:var(--brass); z-index:2; }
  .identity{ text-align:center; margin-bottom:26px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--brass); margin-bottom:8px; }
  .name{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:28px; line-height:1.15; margin-bottom:6px; }
  .role{ font-size:14px; color:var(--stone); }
  .role span{ color:var(--ivory); }
  .rule{ width:36px; height:1px; background:var(--brass-dim); margin:18px auto 0; }
  .actions{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-bottom:22px; }
  .action{ display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 10px; border-radius:11px; font-size:13px; font-weight:500; text-decoration:none; border:1px solid var(--line); color:var(--ivory); background:#17150F; cursor:pointer; }
  .action.primary{ grid-column:1/-1; background:var(--brass); color:#171512; border-color:var(--brass); font-weight:600; }
  .action svg{ width:15px; height:15px; flex-shrink:0; }
  .action.hidden{ display:none; }
  .connect-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--stone); text-align:center; margin-bottom:12px; }
  .socials{ display:flex; justify-content:center; gap:14px; margin-bottom:30px; }
  .socials a{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--stone); text-decoration:none; }
  .socials a.hidden{ display:none; }
  .socials svg{ width:16px; height:16px; }
  .blocks{ margin-bottom:22px; display:flex; flex-direction:column; gap:10px; }
  .blocks:empty{ display:none; margin-bottom:0; }
  .block-link{ display:flex; align-items:center; justify-content:center; padding:13px 16px; border-radius:11px; font-size:13px; font-weight:500; text-decoration:none; border:1px solid var(--line); color:var(--ivory); background:#17150F; }
  .block-link:hover{ border-color:var(--brass-dim); }
  .block-highlight{ padding:16px; border-radius:11px; border:1px solid var(--line); background:#17150F; font-size:13px; font-style:italic; color:var(--ivory); text-align:center; }
  .block-highlight .attribution{ display:block; margin-top:8px; font-size:11px; font-style:normal; color:var(--stone); }
  .block-media img{ width:100%; border-radius:11px; display:block; }
  .block-media .caption{ font-size:11px; color:var(--stone); text-align:center; margin-top:6px; }

  #leadForm{ margin-bottom:22px; display:none; }
  .lead-field{ margin-bottom:10px; }
  .lead-field input, .lead-field textarea{ width:100%; background:#17150F; border:1px solid var(--line); border-radius:9px; padding:11px 13px; color:var(--ivory); font-family:'Inter',sans-serif; font-size:13px; outline:none; resize:none; }
  .lead-field input:focus, .lead-field textarea:focus{ border-color:var(--brass-dim); }
  .lead-field input::placeholder, .lead-field textarea::placeholder{ color:#5B564D; }

  .footer{ display:flex; align-items:center; justify-content:center; gap:6px; padding-top:18px; border-top:1px solid var(--line); }
  .footer-mark{ font-family:'Fraunces',serif; font-style:italic; font-size:13px; color:var(--brass); }
  .footer-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--stone); text-transform:uppercase; }
  .state-msg{ display:none; text-align:center; color:var(--stone); font-size:13px; padding:40px 20px; }

  /* ---- premium look (photo background, glass card, pill buttons) ---- */
  #bgLayer{ position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; opacity:0; transition:opacity .8s ease; filter:blur(1.5px) brightness(.78) saturate(1.05); transform:scale(1.04); pointer-events:none; }
  #bgLayer.on{ opacity:1; }
  body.has-bg::after{ content:""; position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.42) 100%); pointer-events:none; }
  body.has-bg{ padding:44px 30px; }
  .card, .skeleton, .state-msg{ z-index:1; }

  .card-art{ display:none; position:absolute; inset:0; z-index:0; background-size:cover; background-position:center 25%; filter:brightness(.72) contrast(1.05); opacity:0; pointer-events:none; -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 32%, rgba(0,0,0,.35) 100%); mask-image:linear-gradient(to bottom, #000 0%, #000 32%, rgba(0,0,0,.35) 100%); transition:opacity .8s ease; }
  .card-art::after{ content:""; position:absolute; inset:0; background:linear-gradient(to bottom, color-mix(in srgb, color-mix(in srgb, var(--brass) 14%, #060706) 66%, transparent) 0%, color-mix(in srgb, color-mix(in srgb, var(--brass) 14%, #060706) 80%, transparent) 40%, color-mix(in srgb, color-mix(in srgb, var(--brass) 14%, #060706) 90%, transparent) 100%); }
  .monogram{ display:none; position:absolute; top:26px; left:28px; z-index:1; font-family:'Fraunces',serif; font-size:30px; line-height:1; color:var(--ivory); letter-spacing:-1px; }
  .monogram::after{ content:"✦"; display:block; font-size:9px; color:var(--brass); margin:8px 0 0 9px; letter-spacing:0; }

  .card.premium{ max-width:400px; border-radius:30px; padding:44px 28px 28px; border:1px solid color-mix(in srgb, var(--brass) 55%, transparent); background:linear-gradient(165deg, color-mix(in srgb, var(--brass) 16%, #0b0d0b) 0%, #0a0b0a 65%); box-shadow:0 0 0 1px rgba(255,255,255,.04) inset, 0 28px 70px rgba(0,0,0,.6), 0 0 50px color-mix(in srgb, var(--brass) 12%, transparent); }
  .card.premium .card-art{ display:block; }
  .card.premium .card-art.on{ opacity:1; }
  body.has-bg .card.premium{ background:linear-gradient(165deg, color-mix(in srgb, color-mix(in srgb, var(--brass) 16%, #0b0d0b) 58%, transparent) 0%, color-mix(in srgb, #0a0b0a 66%, transparent) 100%); backdrop-filter:blur(14px) saturate(1.15); -webkit-backdrop-filter:blur(14px) saturate(1.15); }
  .card.premium .monogram{ display:block; }
  .card.premium .tap-zone, .card.premium .identity, .card.premium .actions, .card.premium .connect-label,
  .card.premium .socials, .card.premium .blocks, .card.premium #leadCaptureSection, .card.premium .footer,
  .card.premium #ownerEditLink{ position:relative; z-index:1; }

  .card.premium .tap-zone{ width:140px; height:140px; }
  .card.premium .avatar{ width:100px; height:100px; border:2px solid var(--brass); box-shadow:0 0 0 6px color-mix(in srgb, var(--brass) 12%, transparent), 0 12px 32px rgba(0,0,0,.55); }
  .card.premium .identity{ margin-bottom:28px; }
  .card.premium .eyebrow{ letter-spacing:4px; font-size:10px; }
  .card.premium .name{ font-size:32px; text-shadow:0 2px 14px rgba(0,0,0,.55); }
  .card.premium .identity{ text-shadow:0 1px 10px rgba(0,0,0,.75); }
  .card.premium .role{ letter-spacing:.08em; font-size:13px; color:color-mix(in srgb, var(--ivory) 85%, transparent); }
  .card.premium #bio{ font-family:'Fraunces',serif; font-style:italic; letter-spacing:.02em; font-size:14px; color:color-mix(in srgb, var(--brass) 75%, var(--ivory)); }
  .card.premium .rule{ background:var(--brass); width:44px; }

  .card.premium .actions{ gap:12px; }
  .card.premium .action{ justify-content:flex-start; gap:12px; padding:14px 18px; border-radius:999px; background:rgba(8,10,8,.5); border:1px solid color-mix(in srgb, var(--brass) 45%, transparent); font-family:'Fraunces',serif; font-style:italic; font-weight:400; font-size:15px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .card.premium .action svg{ width:18px; height:18px; color:var(--brass); }
  .card.premium .action::after{ content:"→"; margin-left:auto; color:var(--brass); font-style:normal; font-family:'Inter',sans-serif; }
  .card.premium .action.primary{ background:linear-gradient(100deg, color-mix(in srgb, var(--brass) 30%, #0c0f0c), color-mix(in srgb, var(--brass) 10%, #0a0c0a)); color:var(--ivory); border-color:var(--brass); font-weight:500; box-shadow:0 6px 24px color-mix(in srgb, var(--brass) 18%, transparent); }
  .card.premium .action.primary svg{ display:none; }
  .card.premium .action.primary::before{ content:"✦"; color:var(--brass); font-style:normal; font-size:16px; }

  .card.premium .connect-label{ display:flex; align-items:center; gap:14px; letter-spacing:3px; }
  .card.premium .connect-label::before, .card.premium .connect-label::after{ content:""; flex:1; height:1px; background:color-mix(in srgb, var(--brass) 35%, transparent); }
  .card.premium .socials a{ width:46px; height:46px; border-color:color-mix(in srgb, var(--brass) 55%, transparent); color:var(--brass); background:rgba(8,10,8,.4); }
  .card.premium .socials svg{ width:19px; height:19px; }
  .card.premium .block-link{ border-radius:999px; font-family:'Fraunces',serif; font-style:italic; font-size:15px; background:rgba(8,10,8,.5); border-color:color-mix(in srgb, var(--brass) 40%, transparent); }
  .card.premium .footer{ flex-direction:column; border-top:none; gap:4px; padding-top:8px; }
  .card.premium .footer-mark{ display:flex; align-items:center; justify-content:center; gap:14px; width:70%; font-size:20px; }
  .card.premium .footer-mark::before, .card.premium .footer-mark::after{ content:""; flex:1; height:1px; background:color-mix(in srgb, var(--brass) 35%, transparent); }
  .card.premium .footer-sub{ letter-spacing:3px; }
  .card.premium .footer-sub .dot{ display:none; }
  .card.premium .action{ min-width:0; }
  @media (max-width:420px){
    .card.premium{ padding-left:22px; padding-right:22px; }
    .card.premium .action{ padding:13px 16px; font-size:14px; }
    .card.premium .action:not(.primary):not(#connectToggleBtn)::after{ display:none; }
  }

  /* ---- toast ---- */
  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(12px);
    background:var(--brass);
    color:#171512;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:12px 20px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce){ .toast{ transition:opacity .01s linear; } }

  /* ---- card entrance ---- */
  .card{ opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease; }
  .card.show{ opacity:1; transform:translateY(0); }

  /* ---- skeleton loading state ---- */
  .skeleton{ width:100%; max-width:380px; background:var(--bg-elev); border:1px solid var(--line); border-radius:20px; padding:40px 28px 28px; }
  .skel-bar{ border-radius:6px; background:linear-gradient(90deg, #1B1917 25%, #26221C 37%, #1B1917 63%); background-size:400% 100%; animation:shimmer 1.6s ease-in-out infinite; }
  @keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  .skel-avatar{ width:72px; height:72px; border-radius:50%; margin:0 auto 26px; }
  .skel-name{ width:60%; height:20px; margin:0 auto 10px; }
  .skel-role{ width:75%; height:12px; margin:0 auto 30px; }
  .skel-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .skel-actions .skel-bar{ height:42px; }
  .skel-actions .full{ grid-column:1/-1; }
  .skel-connect-label{ width:70px; height:10px; margin:0 auto 14px; }
  .skel-socials{ display:flex; justify-content:center; gap:14px; margin-bottom:30px; }
  .skel-socials .skel-bar{ width:38px; height:38px; border-radius:50%; }
  .skel-footer{ width:120px; height:12px; margin:18px auto 0; }
  @media (prefers-reduced-motion: reduce){
    .skel-bar{ animation:none; }
    .card{ transition:none; }
  }
</style>
</head>
<body>

<div id="bgLayer"></div>

<div class="card" id="card" style="display:none;">
  <div class="card-art" id="cardArt"></div>
  <div class="monogram" id="monogram"></div>
  <div class="tap-zone">
    <div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div>
    <div class="avatar" id="initials">--</div>
  </div>
  <div class="identity">
    <div class="eyebrow">Qanvora Profile</div>
    <div class="name" id="name">—</div>
    <div class="role" id="role"></div>
    <div class="role" id="bio" style="margin-top:2px;"></div>
    <div class="rule"></div>
  </div>
  <div class="actions">
    <a class="action primary" id="saveContactBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Save Contact
    </a>
    <a class="action" id="callBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Call
    </a>
    <a class="action" id="waBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"/></svg>
      WhatsApp
    </a>
    <a class="action" id="emailBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
      Email
    </a>
  </div>
  <div class="connect-label">Connect</div>
  <div class="socials">
    <a href="#" id="liBtn" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.15 1.45-2.15 2.94v5.66H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg></a>
    <a href="#" id="igBtn" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
    <a href="#" id="webBtn" aria-label="Website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
  </div>
  <div class="blocks" id="blocksContainer"></div>

  <div id="leadCaptureSection" style="display:none;">
  <button class="action" id="connectToggleBtn" style="width:100%; margin-bottom:14px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Share Your Contact
  </button>
  <form id="leadForm">
    <div class="lead-field"><input type="text" id="leadName" placeholder="Your name" required></div>
    <div class="lead-field"><input type="email" id="leadEmail" placeholder="Your email" required></div>
    <div class="lead-field"><input type="text" id="leadPhone" placeholder="Your phone (optional)"></div>
    <div class="lead-field"><textarea id="leadMessage" placeholder="Message (optional)" rows="2"></textarea></div>
    <button type="submit" class="action primary" style="width:100%;">Send</button>
  </form>
  </div>

  <div class="footer">
    <span class="footer-mark">Qanvora</span><span class="footer-sub"><span class="dot">·</span> Tap to Connect</span>
  </div>

  <a href="admin.html" id="ownerEditLink" style="display:none; text-align:center; margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--brass); text-transform:uppercase; text-decoration:none;">Edit My Profile</a>
</div>

<div class="skeleton" id="skeleton">
  <div class="skel-bar skel-avatar"></div>
  <div class="skel-bar skel-name"></div>
  <div class="skel-bar skel-role"></div>
  <div class="skel-actions">
    <div class="skel-bar full"></div>
    <div class="skel-bar"></div>
    <div class="skel-bar"></div>
    <div class="skel-bar"></div>
  </div>
  <div class="skel-bar skel-connect-label"></div>
  <div class="skel-socials">
    <div class="skel-bar"></div>
    <div class="skel-bar"></div>
    <div class="skel-bar"></div>
  </div>
  <div class="skel-bar skel-footer"></div>
</div>

<div class="state-msg" id="stateMsg"></div>
<div class="toast" id="toast"></div>

<script>
  // ====== PASTE YOUR SUPABASE VALUES HERE (same as admin.html) ======
  const SUPABASE_URL = "https://bibusweogtxqgianrvyb.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_QmcRmNwgumBxUf3HTSmRiA_HgbgryV1";
  // ====================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ACCENT_DIM = {
    "#C9A063": "#8B7048",
    "#C98F82": "#8B615A",
    "#8FA888": "#5F725C",
    "#7C93A8": "#556673",
    "#C77C56": "#8A5539",
    "#A290C4": "#6D6084",
    "#8A94A6": "#5C6370"
  };

  function cssUrl(u){ return "url(" + JSON.stringify(u) + ")"; }

  function applyPremiumLook(data){
    document.getElementById("card").classList.add("premium");

    const initials = (data.name || "").split(" ").filter(Boolean).slice(0,2).map(w => w[0]?.toUpperCase() || "").join("");
    document.getElementById("monogram").textContent = initials;

    if(data.card_image_url && /^https:\/\//.test(data.card_image_url)){
      const art = document.getElementById("cardArt");
      art.style.backgroundImage = cssUrl(data.card_image_url);
      art.classList.add("on");
    }
    if(data.bg_image_url && /^https:\/\//.test(data.bg_image_url)){
      const bg = document.getElementById("bgLayer");
      bg.style.backgroundImage = cssUrl(data.bg_image_url);
      bg.classList.add("on");
      document.body.classList.add("has-bg");
    }
  }

  function digitsOnly(s){ return (s || "").replace(/[^\d+]/g, ""); }
  function withProtocol(url){
    if(!url) return "";
    return /^https?:\/\//i.test(url) ? url : "https://" + url;
  }

  let toastTimer;
  function showToast(message){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function logEvent(profileId, type, label){
    sb.from("profile_events").insert({ profile_id: profileId, event_type: type, link_label: label || null }).then(
      () => {}, () => {}
    );
  }

  function renderBlocks(blocks, slug){
    const container = document.getElementById("blocksContainer");
    container.innerHTML = "";
    blocks.forEach(b => {
      let el;
      if(b.block_type === "link" || b.block_type === "document"){
        el = document.createElement("a");
        el.className = "block-link";
        el.href = b.url;
        el.target = "_blank";
        el.rel = "noopener";
        el.textContent = b.title || (b.block_type === "document" ? "Download" : "Link");
        el.addEventListener("click", () => logEvent(slug, "link_click", b.title || b.block_type));
      } else if(b.block_type === "highlight"){
        el = document.createElement("div");
        el.className = "block-highlight";
        el.textContent = '"' + (b.body || "") + '"';
        if(b.title){
          const attribution = document.createElement("span");
          attribution.className = "attribution";
          attribution.textContent = "— " + b.title;
          el.appendChild(attribution);
        }
      } else if(b.block_type === "media"){
        el = document.createElement("div");
        el.className = "block-media";
        const img = document.createElement("img");
        img.src = b.url;
        img.alt = b.title || "";
        el.appendChild(img);
        if(b.title){
          const caption = document.createElement("div");
          caption.className = "caption";
          caption.textContent = b.title;
          el.appendChild(caption);
        }
      }
      if(el) container.appendChild(el);
    });
  }

  function downloadVCard(p){
    const vcard = [
      "BEGIN:VCARD","VERSION:3.0",
      "FN:" + (p.name || ""),
      "TITLE:" + (p.title || ""),
      "ORG:" + (p.company || ""),
      "TEL;TYPE=CELL:" + (p.phone || ""),
      "EMAIL:" + (p.email || ""),
      "END:VCARD"
    ].join("\n");
    const blob = new Blob([vcard], { type: "text/vcard" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = (p.name || "contact").replace(/\s+/g, "_") + ".vcf";
    link.click();
    showToast("Saved to contacts");
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("id");

    function showState(message){
      document.getElementById("skeleton").style.display = "none";
      const msg = document.getElementById("stateMsg");
      msg.textContent = message;
      msg.style.display = "block";
    }

    if(!slug){
      showState("No profile specified.");
      return;
    }

    const { data, error } = await sb.from("profiles").select("*").eq("id", slug).maybeSingle();

    if(error){
      showState("Something went wrong loading this profile.");
      console.error(error);
      return;
    }
    if(!data){
      showState("This profile hasn't been set up yet.");
      return;
    }

    logEvent(slug, "view");

    if(data.accent_color && ACCENT_DIM[data.accent_color]){
      document.documentElement.style.setProperty("--brass", data.accent_color);
      document.documentElement.style.setProperty("--brass-dim", ACCENT_DIM[data.accent_color]);
    }

    if(data.tier === "premium"){ applyPremiumLook(data); }

    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user && session.user.id === data.owner_id){
      document.getElementById("ownerEditLink").style.display = "block";
    }

    document.getElementById("skeleton").style.display = "none";
    const card = document.getElementById("card");
    card.style.display = "block";
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add("show")));

    document.getElementById("name").textContent = data.name || "—";
    document.getElementById("role").innerHTML = (data.title || "") + (data.company ? ' at <span>' + data.company + '</span>' : "");
    const bioEl = document.getElementById("bio");
    if(data.bio){ bioEl.textContent = data.bio; } else { bioEl.style.display = "none"; }

    const initials = (data.name || "").split(" ").filter(Boolean).slice(0,2).map(w => w[0]?.toUpperCase() || "").join("") || "--";
    const avatarEl = document.getElementById("initials");
    if(data.avatar_url){
      avatarEl.innerHTML = '<img src="' + data.avatar_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
    } else {
      avatarEl.textContent = initials;
    }

    document.getElementById("saveContactBtn").onclick = () => {
      logEvent(slug, "save_contact");
      downloadVCard(data);
    };

    const callBtn = document.getElementById("callBtn");
    if(data.phone){ callBtn.href = "tel:" + digitsOnly(data.phone); } else { callBtn.classList.add("hidden"); }
    callBtn.addEventListener("click", () => logEvent(slug, "link_click", "call"));

    const waBtn = document.getElementById("waBtn");
    if(data.whatsapp){ waBtn.href = "https://wa.me/" + digitsOnly(data.whatsapp).replace("+",""); } else { waBtn.classList.add("hidden"); }
    waBtn.addEventListener("click", () => logEvent(slug, "link_click", "whatsapp"));

    const emailBtn = document.getElementById("emailBtn");
    if(data.email){ emailBtn.href = "mailto:" + data.email; } else { emailBtn.classList.add("hidden"); }
    emailBtn.addEventListener("click", () => logEvent(slug, "link_click", "email"));

    const liBtn = document.getElementById("liBtn");
    if(data.linkedin){ liBtn.href = withProtocol(data.linkedin); liBtn.target = "_blank"; } else { liBtn.classList.add("hidden"); }
    liBtn.addEventListener("click", () => logEvent(slug, "link_click", "linkedin"));

    const igBtn = document.getElementById("igBtn");
    if(data.instagram){ igBtn.href = withProtocol(data.instagram); igBtn.target = "_blank"; } else { igBtn.classList.add("hidden"); }
    igBtn.addEventListener("click", () => logEvent(slug, "link_click", "instagram"));

    const webBtn = document.getElementById("webBtn");
    if(data.website){ webBtn.href = withProtocol(data.website); webBtn.target = "_blank"; } else { webBtn.classList.add("hidden"); }
    webBtn.addEventListener("click", () => logEvent(slug, "link_click", "website"));

    if(data.tier === "premium"){
      const { data: blocks } = await sb.from("profile_blocks").select("*").eq("profile_id", slug).order("position", { ascending: true });
      if(blocks && blocks.length){ renderBlocks(blocks, slug); }
      document.getElementById("leadCaptureSection").style.display = "block";
    }

    document.getElementById("connectToggleBtn").addEventListener("click", () => {
      const form = document.getElementById("leadForm");
      form.style.display = form.style.display === "block" ? "none" : "block";
    });

    document.getElementById("leadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("leadName").value.trim();
      const email = document.getElementById("leadEmail").value.trim();
      const phone = document.getElementById("leadPhone").value.trim();
      const message = document.getElementById("leadMessage").value.trim();
      if(!name || !email) return;

      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;

      const { error } = await sb.from("leads").insert({ profile_id: slug, name, email, phone, message });

      submitBtn.disabled = false;
      if(error){
        showToast("Something went wrong — try again");
        console.error(error);
      } else {
        showToast("Sent! Thanks for connecting.");
        e.target.reset();
        e.target.style.display = "none";
      }
    });
  }

  init();
</script>

</body>
</html>
